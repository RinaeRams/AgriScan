services:
  - type: web
    name: agriscan-app
    runtime: python3
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: SECRET_KEY
        value: agriscan-secret-key-2025
      - key: MONGO_URI
        value: mongodb+srv://Rinae-User:RamadiRR@cluster1.yzmbbvs.mongodb.net/agriscan?appName=Cluster1
