{% extends 'admin/base.html' %}
{% block title %}Users - AgriScan Admin{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="fas fa-users me-2"></i>User Management</h1>
    <button class="btn btn-custom" onclick="showAddUserModal()">
        <i class="fas fa-plus me-2"></i>Add User
    </button>
</div>

<div class="card mb-4">
    <div class="card-body">
        <div class="row g-3">
            <div class="col-md-4">
                <input type="text" class="form-control" id="userSearch" placeholder="Search users by name or email..." onkeyup="filterUsers()">
            </div>
            <div class="col-md-3">
                <select class="form-select" id="roleFilter" onchange="filterUsers()">
                    <option value="">All Roles</option>
                    <option value="admin">Admin</option>
                    <option value="user">User</option>
                </select>
            </div>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Location</th>
                        <th>Role</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="usersTable">
                    <tr><td colspan="6" class="text-center">Loading users...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="userModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="userModalTitle">Add User</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="userForm">
                    <input type="hidden" id="userId">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">First Name</label>
                            <input type="text" class="form-control" id="firstName" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="lastName" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" id="password">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phone</label>
                        <input type="text" class="form-control" id="phone">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Location</label>
                        <input type="text" class="form-control" id="location">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Role</label>
                        <select class="form-select" id="role">
                            <option value="user">User</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-custom" onclick="saveUser()">Save User</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let allUsers = [];

function loadUsers() {
    fetch('/admin/api/users')
        .then(r => r.json())
        .then(res => {
            if (!res.success) {
                document.getElementById('usersTable').innerHTML = '<tr><td colspan="6" class="text-center text-danger">Failed to load users</td></tr>';
                return;
            }
            allUsers = res.users || [];
            renderUsers(allUsers);
        })
        .catch(err => {
            console.error('Users error:', err);
            document.getElementById('usersTable').innerHTML = '<tr><td colspan="6" class="text-center text-danger">Error loading users</td></tr>';
        });
}

function renderUsers(users) {
    if (users.length === 0) {
        document.getElementById('usersTable').innerHTML = '<tr><td colspan="6" class="text-center">No users found</td></tr>';
        return;
    }
    const html = users.map(u => `
        <tr>
            <td><strong>${u.firstName || ''} ${u.lastName || ''}</strong></td>
            <td>${u.email || ''}</td>
            <td>${u.phone || 'N/A'}</td>
            <td>${u.location || 'N/A'}</td>
            <td><span class="badge bg-${u.role === 'admin' ? 'primary' : 'secondary'}">${u.role || 'user'}</span></td>
            <td>
                <button class="btn btn-sm btn-outline-primary me-1" onclick="editUser('${u.id}')">
                    <i class="fas fa-edit"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger" onclick="deleteUser('${u.id}')">
                    <i class="fas fa-trash"></i>
                </button>
            </td>
        </tr>
    `).join('');
    document.getElementById('usersTable').innerHTML = html;
}

function filterUsers() {
    const search = document.getElementById('userSearch').value.toLowerCase();
    const role = document.getElementById('roleFilter').value;

    let filtered = allUsers;
    if (search) {
        filtered = filtered.filter(u =>
            (u.firstName + ' ' + u.lastName).toLowerCase().includes(search) ||
            (u.email || '').toLowerCase().includes(search)
        );
    }
    if (role) {
        filtered = filtered.filter(u => u.role === role);
    }
    renderUsers(filtered);
}

function showAddUserModal() {
    document.getElementById('userModalTitle').textContent = 'Add User';
    document.getElementById('userId').value = '';
    document.getElementById('userForm').reset();
    new bootstrap.Modal(document.getElementById('userModal')).show();
}

function editUser(userId) {
    const user = allUsers.find(u => u.id === userId);
    if (!user) return;

    document.getElementById('userModalTitle').textContent = 'Edit User';
    document.getElementById('userId').value = user.id;
    document.getElementById('firstName').value = user.firstName || '';
    document.getElementById('lastName').value = user.lastName || '';
    document.getElementById('email').value = user.email || '';
    document.getElementById('password').value = '';
    document.getElementById('phone').value = user.phone || '';
    document.getElementById('location').value = user.location || '';
    document.getElementById('role').value = user.role || 'user';
    new bootstrap.Modal(document.getElementById('userModal')).show();
}

function saveUser() {
    const userId = document.getElementById('userId').value;
    const data = {
        firstName: document.getElementById('firstName').value,
        lastName: document.getElementById('lastName').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        location: document.getElementById('location').value,
        role: document.getElementById('role').value
    };
    const password = document.getElementById('password').value;
    if (password) data.password = password;

    if (!data.firstName || !data.lastName || !data.email) {
        alert('First name, last name, and email are required');
        return;
    }

    const method = userId ? 'PUT' : 'POST';
    const url = userId ? `/admin/api/users/${userId}` : '/admin/api/users';

    fetch(url, {
        method: method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    })
    .then(r => r.json())
    .then(res => {
        if (res.success) {
            bootstrap.Modal.getInstance(document.getElementById('userModal')).hide();
            loadUsers();
        } else {
            alert(res.message || 'Failed to save user');
        }
    });
}

function deleteUser(userId) {
    if (!confirm('Are you sure you want to delete this user?')) return;
    fetch(`/admin/api/users/${userId}`, { method: 'DELETE' })
        .then(r => r.json())
        .then(res => {
            if (res.success) {
                loadUsers();
            } else {
                alert('Failed to delete user');
            }
        });
}

document.addEventListener('DOMContentLoaded', loadUsers);
</script>
{% endblock %}
