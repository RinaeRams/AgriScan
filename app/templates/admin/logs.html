{% extends 'admin/base.html' %}
{% block title %}System Logs - AgriScan Admin{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="fas fa-clipboard-list me-2"></i>System Logs</h1>
    <button class="btn btn-outline-secondary" onclick="window.location.reload()">
        <i class="fas fa-sync-alt me-2"></i>Refresh
    </button>
</div>

<div class="card mb-4">
    <div class="card-body">
        <div class="row g-3">
            <div class="col-md-4">
                <input type="text" class="form-control" id="actionFilter" placeholder="Filter by action...">
            </div>
            <div class="col-md-2">
                <button class="btn btn-custom w-100" onclick="loadLogs()">
                    <i class="fas fa-search me-2"></i>Filter
                </button>
            </div>
            <div class="col-md-2">
                <button class="btn btn-outline-secondary w-100" onclick="clearFilter()">Clear</button>
            </div>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>Action</th>
                        <th>Details</th>
                        <th>User</th>
                        <th>Role</th>
                        <th>Time</th>
                    </tr>
                </thead>
                <tbody id="logsTable">
                    <tr><td colspan="5" class="text-center">Loading logs...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentActionFilter = '';

function loadLogs() {
    currentActionFilter = document.getElementById('actionFilter').value;
    const url = currentActionFilter ? `/admin/api/logs?action=${encodeURIComponent(currentActionFilter)}` : '/admin/api/logs';

    fetch(url)
        .then(r => r.json())
        .then(res => {
            if (!res.success) {
                document.getElementById('logsTable').innerHTML = '<tr><td colspan="5" class="text-center text-danger">Failed to load logs</td></tr>';
                return;
            }
            const logs = res.logs || [];
            if (logs.length === 0) {
                document.getElementById('logsTable').innerHTML = '<tr><td colspan="5" class="text-center">No logs found</td></tr>';
                return;
            }
            const html = logs.map(l => `
                <tr>
                    <td><strong>${l.action || 'N/A'}</strong></td>
                    <td>${l.details || 'N/A'}</td>
                    <td>${l.user_email || 'system'}</td>
                    <td><span class="badge bg-${l.user_role === 'admin' ? 'primary' : 'secondary'}">${l.user_role || 'user'}</span></td>
                    <td>${l.timestamp ? new Date(l.timestamp).toLocaleString() : 'N/A'}</td>
                </tr>
            `).join('');
            document.getElementById('logsTable').innerHTML = html;
        })
        .catch(err => {
            console.error('Logs error:', err);
            document.getElementById('logsTable').innerHTML = '<tr><td colspan="5" class="text-center text-danger">Error loading logs</td></tr>';
        });
}

function clearFilter() {
    document.getElementById('actionFilter').value = '';
    currentActionFilter = '';
    loadLogs();
}

document.addEventListener('DOMContentLoaded', loadLogs);
</script>
{% endblock %}
